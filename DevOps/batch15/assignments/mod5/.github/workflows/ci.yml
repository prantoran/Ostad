name: CI

# Runs on every PR into main and on every push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Backend: matrix across Node versions, runs in parallel with frontend ----
  backend-test:
    name: Backend lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  backend-build:
    name: Backend build
    needs: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 14

  # ---- Frontend ----
  frontend-test:
    name: Frontend lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend-build:
    name: Frontend build
    needs: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14

  # Single stable check name to mark as "required" in branch protection.
  ci-passed:
    name: CI passed
    if: always()
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          echo "backend-build:  ${{ needs.backend-build.result }}"
          echo "frontend-build: ${{ needs.frontend-build.result }}"
          [ "${{ needs.backend-build.result }}" = "success" ] && [ "${{ needs.frontend-build.result }}" = "success" ]
